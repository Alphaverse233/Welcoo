<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team - My College Project</title>
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    color: #333;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }
  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .blob {
    position: fixed; border-radius: 50%; filter: blur(50px);
    opacity: 0.35; z-index: 0; animation: float 8s ease-in-out infinite;
  }
  .blob1 { width: 200px; height: 200px; background: #ffdde1; top: 8%; left: -60px; animation-delay: 0s; }
  .blob2 { width: 160px; height: 160px; background: #ffe29f; bottom: 20%; right: -50px; animation-delay: 3s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-30px) scale(1.1); }
  }
  nav {
    position: relative; z-index: 10;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    padding: 16px; text-align: center;
  }
  nav a {
    color: white; margin: 0 14px; text-decoration: none;
    font-weight: 600; font-size: 0.95rem; opacity: 0.85;
    position: relative; transition: opacity 0.2s ease;
  }
  nav a::after {
    content: ''; position: absolute; left: 0; bottom: -4px;
    width: 0%; height: 2px; background: white; transition: width 0.3s ease;
  }
  nav a:hover::after { width: 100%; }
  nav a.active::after { width: 100%; }
  nav a:hover { opacity: 1; }
  h1.page-title {
    position: relative; z-index: 5;
    text-align: center; color: white;
    padding: 50px 20px 30px;
    font-size: 2.2rem;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .container {
    position: relative; z-index: 5;
    max-width: 900px; margin: 0 auto 60px; padding: 0 20px;
    display: flex; flex-wrap: wrap; gap: 22px; justify-content: center;
  }
  .member-card {
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius: 16px; padding: 30px; width: 240px; text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .member-card:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 16px 35px rgba(0,0,0,0.25); }
  .avatar {
    width: 75px; height: 75px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 1.6rem; font-weight: 700;
    box-shadow: 0 6px 18px rgba(102,126,234,0.4);
  }
  .member-card h3 { color: #333; margin-bottom: 6px; font-size: 1.15rem; }
  .member-card p { color: #777; font-size: 0.9rem; }
  footer {
    position: relative; z-index: 5;
    text-align: center; color: white; padding: 20px; opacity: 0.8; font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>

<nav data-aos="fade-down">
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="team.html" class="active">Team</a>
  <a href="contact.html">Contact</a>
</nav>

<h1 class="page-title" data-aos="zoom-in">👥 Team Members</h1>

<div class="container">
  <div class="member-card" data-aos="fade-up" data-aos-delay="0">
    <div class="avatar">M1</div>
    <h3>Member 1 Name</h3>
    <p>Role / Roll No</p>
  </div>
  <div class="member-card" data-aos="fade-up" data-aos-delay="150">
    <div class="avatar">M2</div>
    <h3>Member 2 Name</h3>
    <p>Role / Roll No</p>
  </div>
  <div class="member-card" data-aos="fade-up" data-aos-delay="300">
    <div class="avatar">M3</div>
    <h3>Member 3 Name</h3>
    <p>Role / Roll No</p>
  </div>
</div>

<footer data-aos="fade-up">Made with ❤️ by Alphaverse233</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
  AOS.init({ duration: 900, easing: 'ease-out-cubic', once: true });
</script>

</body>
</html>
