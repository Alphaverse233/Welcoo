<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team - My College Project</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #333;
    min-height: 100vh;
  }
  nav {
    background: rgba(0,0,0,0.2);
    padding: 16px;
    text-align: center;
  }
  nav a {
    color: white;
    margin: 0 14px;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }
  nav a:hover { opacity: 1; }
  h1.page-title {
    text-align: center;
    color: white;
    padding: 40px 20px 20px;
    animation: fadeIn 0.8s ease;
  }
  .container {
    max-width: 900px;
    margin: 0 auto 50px;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
  }
  .member-card {
    background: white;
    border-radius: 14px;
    padding: 28px;
    width: 250px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    animation: fadeIn 0.8s ease;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .member-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 28px rgba(0,0,0,0.18);
  }
  .avatar {
    width: 70px;
    height: 70px;
    background: #667eea;
    border-radius: 50%;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.5rem;
    font-weight: 700;
  }
  .member-card h3 { color: #333; margin-bottom: 4px; }
  .member-card p { color: #777; font-size: 0.9rem; }
  footer {
    text-align: center;
    color: white;
    padding: 20px;
    opacity: 0.75;
    font-size: 0.9rem;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="team.html">Team</a>
  <a href="contact.html">Contact</a>
</nav>

<h1 class="page-title">Team Members</h1>

<div class="container">
  <div class="member-card">
    <div class="avatar">M1</div>
    <h3>Member 1 Name</h3>
    <p>Role / Roll No</p>
  </div>
  <div class="member-card">
    <div class="avatar">M2</div>
    <h3>Member 2 Name</h3>
    <p>Role / Roll No</p>
  </div>
  <div class="member-card">
    <div class="avatar">M3</div>
    <h3>Member 3 Name</h3>
    <p>Role / Roll No</p>
  </div>
</div>

<footer>Made by Alphaverse233</footer>

</body>
</html>
